  rework_header: "## {role_name} 反馈（请修改后重新提交）"
  rework_design_header: "## 原始设计方案（必须遵循）"
  rework_prd_header: "## 原始需求"
  rework_max_reached: "老板，{role_name} 已经打回 {max_rework} 次了，团队尽力修了但还有问题。先继续推进，后续再优化 🫡"
  role_error: "{role_name} 执行出错了: {error}，跳过继续。"
  pipeline_complete: "老板，任务完成了！"
  supplement_header: "## 老板补充需求"
  file_sent: "{filename} 已发送，摘要：{summary}"
  content_truncated: "\n\n... (内容过长已截断)"
  files_omitted: "\n... (更多文件省略)"
  files_limit_reached: "\n... (已达文件上限 {max_files})"
  file_truncated: "\n... (文件过长已截断)"
  write_file_warning: "\n\n[WARNING] write_file 未被调用，代码可能没有写入磁盘。"
