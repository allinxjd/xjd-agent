<!doctype html>
<!--
  Mobile UI seed template.
  iPhone 15 Pro frame (390x844) with status bar, Dynamic Island, and home indicator.
  All CSS classes are pre-defined — LLM only uses classes, never writes raw CSS.
  Replace the 6 :root variables with the active design system's tokens.
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>[REPLACE] 页面名称</title>
  <style>
    :root {
      --bg:      #EDEDED;
      --surface: #FFFFFF;
      --fg:      #000000;
      --muted:   #888888;
      --border:  #E5E5E5;
      --accent:  #07C160;

      --accent-soft: color-mix(in srgb, var(--accent) 12%, transparent);
      --danger:  #FA5151;
      --link:    #576B95;

      --font: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
      --fs-xl: 22px;
      --fs-lg: 20px;
      --fs-md: 17px;
      --fs-sm: 15px;
      --fs-xs: 13px;
      --fs-xxs: 12px;

      --nav-height: 44px;
      --safe-bottom: 34px;
      --radius: 8px;
      --radius-lg: 12px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #1a1a1a;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Device Frame ── */
    .device {
      width: 390px;
      height: 844px;
      border-radius: 54px;
      background: var(--bg);
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 0 12px #1a1a1a, 0 0 0 14px #333, 0 24px 80px rgba(0,0,0,0.4);
    }
<!-- PLACEHOLDER_CONTINUE -->

    /* ── Status Bar ── */
    .statusbar {
      height: 54px;
      padding: 14px 24px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 10;
    }
    .statusbar .time { font-size: var(--fs-xs); font-weight: 600; }
    .statusbar .icons { display: flex; gap: 6px; align-items: center; }
    .dynamic-island {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 126px;
      height: 36px;
      background: #000;
      border-radius: 20px;
    }

    /* ── Navigation Bar ── */
    .navbar {
      height: var(--nav-height);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      background: var(--surface);
      border-bottom: 0.5px solid var(--border);
      position: relative;
    }
    .navbar .title { font-size: var(--fs-md); font-weight: 500; }
    .navbar .back {
      position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
      font-size: var(--fs-md); color: var(--accent); background: none; border: none;
    }
    .navbar .action {
      position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
      font-size: var(--fs-sm); color: var(--accent); background: none; border: none;
    }

    /* ── Content Area ── */
    .screen {
      height: calc(100% - 54px - var(--safe-bottom));
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .content { flex: 1; }

    /* ── Spacing & Layout ── */
    .pad { padding: 16px; }
    .pad-sm { padding: 12px 16px; }
    .stack { display: flex; flex-direction: column; gap: 12px; }
    .stack-sm { display: flex; flex-direction: column; gap: 8px; }
    .row { display: flex; align-items: center; gap: 12px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .section-gap { height: 8px; background: var(--bg); }

    /* ── Typography ── */
    .h1 { font-size: var(--fs-xl); font-weight: 600; line-height: 1.3; color: var(--fg); }
    .h2 { font-size: var(--fs-lg); font-weight: 600; line-height: 1.3; color: var(--fg); }
    .h3 { font-size: var(--fs-md); font-weight: 500; line-height: 1.4; color: var(--fg); }
    .body { font-size: var(--fs-sm); line-height: 1.5; color: var(--fg); }
    .meta { font-size: var(--fs-xs); color: var(--muted); }
    .caption { font-size: var(--fs-xxs); color: var(--muted); }
    .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
    .link { color: var(--link); text-decoration: none; }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 16px;
    }
    .card-flat {
      background: var(--surface);
      padding: 16px;
      border-bottom: 0.5px solid var(--border);
    }
<!-- PLACEHOLDER_CONTINUE_2 -->

    /* ── List / Cell ── */
    .cell {
      display: flex;
      align-items: center;
      padding: 16px;
      background: var(--surface);
      min-height: 44px;
      gap: 12px;
    }
    .cell + .cell { border-top: 0.5px solid var(--border); margin-left: 16px; border-top-width: 0.5px; }
    .cell .cell-body { flex: 1; min-width: 0; }
    .cell .cell-title { font-size: var(--fs-md); color: var(--fg); }
    .cell .cell-desc { font-size: var(--fs-xs); color: var(--muted); margin-top: 2px; }
    .cell .cell-arrow { color: var(--muted); font-size: 14px; }
    .cell .cell-value { font-size: var(--fs-md); color: var(--muted); }

    /* ── Avatar ── */
    .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--border); flex-shrink: 0;
    }
    .avatar-sm { width: 32px; height: 32px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
    .avatar-lg { width: 56px; height: 56px; border-radius: 50%; background: var(--border); flex-shrink: 0; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 12px 24px; border-radius: var(--radius); font-size: var(--fs-md);
      font-weight: 500; border: none; cursor: pointer; width: 100%;
      transition: opacity 0.15s;
    }
    .btn:active { opacity: 0.7; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-default { background: var(--surface); color: var(--fg); border: 0.5px solid var(--border); }
    .btn-warn { background: var(--danger); color: #fff; }
    .btn-ghost { background: transparent; color: var(--accent); }
    .btn-sm { padding: 8px 16px; font-size: var(--fs-sm); width: auto; }

    /* ── Tags & Pills ── */
    .tag {
      display: inline-flex; align-items: center; padding: 4px 10px;
      border-radius: 4px; font-size: var(--fs-xxs); background: var(--accent-soft); color: var(--accent);
    }
    .pill {
      display: inline-flex; align-items: center; padding: 6px 14px;
      border-radius: 999px; font-size: var(--fs-xs); background: var(--surface); border: 0.5px solid var(--border);
    }
    .pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* ── Input ── */
    .input-group { padding: 12px 16px; background: var(--surface); }
    .input-group + .input-group { border-top: 0.5px solid var(--border); }
    .input-group label { font-size: var(--fs-sm); color: var(--fg); display: block; margin-bottom: 4px; }
    .input {
      width: 100%; border: none; outline: none; font-size: var(--fs-md);
      font-family: var(--font); color: var(--fg); background: transparent;
      padding: 4px 0;
    }
    .input::placeholder { color: var(--muted); }

    /* ── Tab Bar ── */
    .tabbar {
      display: flex; align-items: center; justify-content: space-around;
      height: 50px; background: var(--surface); border-top: 0.5px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    .tab {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      font-size: 10px; color: var(--muted); text-decoration: none;
    }
    .tab.active { color: var(--accent); }
    .tab-icon { width: 24px; height: 24px; }

    /* ── Placeholder Image ── */
    .ph-img {
      background: linear-gradient(135deg, var(--accent-soft) 0%, color-mix(in srgb, var(--border) 70%, var(--accent-soft)) 100%);
      border-radius: var(--radius);
      display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: var(--fs-xs);
      position: relative; overflow: hidden;
    }
    .ph-img::after {
      content: ''; position: absolute; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='16' height='16' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='1' cy='1' r='0.8' fill='%23000' opacity='.05'/%3E%3C/svg%3E");
      background-size: 16px 16px;
    }
    .ph-img.square { aspect-ratio: 1; }
    .ph-img.wide { aspect-ratio: 16/9; }
    .ph-img.portrait { aspect-ratio: 3/4; }

    /* ── Search Bar ── */
    .search-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; background: var(--bg); border-radius: var(--radius);
      margin: 8px 16px;
    }
    .search-bar input { flex: 1; border: none; outline: none; background: transparent; font-size: var(--fs-sm); font-family: var(--font); }

    /* ── Badge ── */
    .badge {
      min-width: 18px; height: 18px; padding: 0 5px;
      border-radius: 9px; background: var(--danger); color: #fff;
      font-size: 11px; display: inline-flex; align-items: center; justify-content: center;
    }

    /* ── Bottom Sheet ── */
    .sheet {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: var(--surface); border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      padding: 16px; padding-bottom: calc(16px + var(--safe-bottom));
    }
    .sheet-handle {
      width: 36px; height: 4px; background: var(--border); border-radius: 2px;
      margin: 0 auto 16px;
    }

    /* ── Modal / Dialog ── */
    .modal {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.5); z-index: 100;
    }
    .modal-content {
      background: var(--surface); border-radius: var(--radius-lg);
      padding: 24px; width: 280px; text-align: center;
    }
    .modal-actions { display: flex; gap: 12px; margin-top: 20px; }
    .modal-actions .btn { flex: 1; }

    /* ── Toast ── */
    .toast {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.75); color: #fff; padding: 12px 24px;
      border-radius: var(--radius); font-size: var(--fs-sm); z-index: 200;
    }

    /* ── Action Sheet ── */
    .actionsheet {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: var(--surface); border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      padding-bottom: var(--safe-bottom);
    }
    .actionsheet-item {
      padding: 16px; text-align: center; font-size: var(--fs-md);
      border-bottom: 0.5px solid var(--border); color: var(--fg);
    }
    .actionsheet-cancel {
      padding: 16px; text-align: center; font-size: var(--fs-md);
      color: var(--muted); margin-top: 8px;
    }

    /* ── Empty State ── */
    .empty {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 48px 24px; gap: 12px;
    }
    .empty-icon { width: 64px; height: 64px; color: var(--muted); opacity: 0.5; }

    /* ── Swipe Cell ── */
    .swipe-actions {
      display: flex; position: absolute; right: 0; top: 0; bottom: 0;
    }
    .swipe-action {
      display: flex; align-items: center; justify-content: center;
      padding: 0 20px; color: #fff; font-size: var(--fs-sm);
    }
    .swipe-action-danger { background: var(--danger); }

    /* ── Skeleton ── */
    .skeleton { background: var(--border); border-radius: 4px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

    /* ── Home Indicator ── */
    .home-indicator {
      position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
      width: 134px; height: 5px; background: var(--fg); border-radius: 3px; opacity: 0.2;
    }

    /* ── Print ── */
    @media print {
      body { background: white; padding: 0; }
      .device { box-shadow: none; border: 1px solid #ddd; }
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
  </style>
</head>
<body>
  <div class="device">
    <!-- Status Bar -->
    <div class="statusbar">
      <span class="time">9:41</span>
      <div class="dynamic-island"></div>
      <div class="icons">
        <svg width="16" height="12" viewBox="0 0 16 12"><path d="M1 8h2v4H1zM5 5h2v7H5zM9 3h2v9H9zM13 0h2v12h-2z" fill="currentColor"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2C5 2 2.4 3.6 1 6c1.4 2.4 4 4 7 4s5.6-1.6 7-4c-1.4-2.4-4-4-7-4zm0 6.5A2.5 2.5 0 118 3.5a2.5 2.5 0 010 5z" fill="currentColor"/></svg>
      </div>
    </div>

    <!-- Screen Content (REPLACE THIS SECTION) -->
    <div class="screen">
      <div class="navbar">
        <span class="title">[REPLACE] 页面标题</span>
      </div>
      <div class="content pad">
        <!-- Paste layout from layouts.md here -->
      </div>
    </div>

    <!-- Home Indicator -->
    <div class="home-indicator"></div>
  </div>
</body>
</html>
