<!doctype html>
<!--
  Web prototype seed template.
  Desktop-first responsive page with topnav, content sections, and footer.
  All CSS classes pre-defined — LLM only uses classes, never writes raw CSS.
  Replace the 6 :root variables with the active design system's tokens.
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>[REPLACE] 页面标题</title>
  <style>
    :root {
      --bg:      #FAFAFA;
      --surface: #FFFFFF;
      --fg:      #111111;
      --muted:   #6B6B6B;
      --border:  #E5E5E5;
      --accent:  #2F6FEB;

      --accent-soft: color-mix(in srgb, var(--accent) 10%, transparent);
      --fg-soft: color-mix(in srgb, var(--fg) 6%, transparent);

      --font-display: 'Inter', -apple-system, system-ui, sans-serif;
      --font-body: 'Inter', -apple-system, system-ui, sans-serif;
      --font-mono: ui-monospace, 'JetBrains Mono', monospace;

      --fs-display: 48px;
      --fs-h1: 32px;
      --fs-h2: 24px;
      --fs-h3: 20px;
      --fs-body: 16px;
      --fs-sm: 14px;
      --fs-xs: 12px;

      --max-w: 1200px;
      --gutter: 24px;
      --section-pad: 80px;
      --radius: 8px;
      --radius-lg: 12px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: var(--fs-body);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Layout ── */
    .container { max-width: var(--max-w); margin: 0 auto; padding: 0 var(--gutter); }
    .section { padding: var(--section-pad) 0; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gutter); }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--gutter); }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gutter); }
    .grid-2-1 { display: grid; grid-template-columns: 2fr 1fr; gap: var(--gutter); }
    .grid-1-2 { display: grid; grid-template-columns: 1fr 2fr; gap: var(--gutter); }
    .stack { display: flex; flex-direction: column; }
    .row { display: flex; align-items: center; gap: 12px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; }

    @media (max-width: 920px) {
      :root { --section-pad: 48px; --gutter: 16px; }
      .grid-2, .grid-3, .grid-4, .grid-2-1, .grid-1-2 { grid-template-columns: 1fr; }
    }
<!-- PLACEHOLDER_WEB_CONTINUE -->

    /* ── Top Nav ── */
    .topnav {
      position: sticky; top: 0; z-index: 100;
      background: color-mix(in srgb, var(--surface) 85%, transparent);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 0;
    }
    .topnav .container { display: flex; align-items: center; justify-content: space-between; }
    .topnav .brand { font-size: var(--fs-h3); font-weight: 600; color: var(--fg); text-decoration: none; }
    .topnav .nav-links { display: flex; gap: 24px; }
    .topnav .nav-links a { color: var(--muted); text-decoration: none; font-size: var(--fs-sm); }
    .topnav .nav-links a:hover { color: var(--fg); }

    /* ── Typography ── */
    .h1 { font-family: var(--font-display); font-size: var(--fs-h1); font-weight: 600; line-height: 1.2; color: var(--fg); }
    .h2 { font-family: var(--font-display); font-size: var(--fs-h2); font-weight: 600; line-height: 1.3; color: var(--fg); }
    .h3 { font-family: var(--font-display); font-size: var(--fs-h3); font-weight: 600; line-height: 1.3; color: var(--fg); }
    .display { font-family: var(--font-display); font-size: var(--fs-display); font-weight: 600; line-height: 1.1; letter-spacing: -0.02em; }
    .lead { font-size: var(--fs-h3); color: var(--muted); line-height: 1.5; max-width: 60ch; }
    .eyebrow { font-size: var(--fs-xs); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); }
    .meta { font-size: var(--fs-sm); color: var(--muted); }
    .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    /* ── Hero ── */
    .hero { padding: 100px 0 80px; }
    .hero-center { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 20px; }
    .hero-split { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; }
    .hero-cta { display: flex; gap: 12px; margin-top: 8px; }
    @media (max-width: 920px) { .hero-split { grid-template-columns: 1fr; } }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 10px 20px; border-radius: var(--radius); font-size: var(--fs-sm);
      font-weight: 500; border: none; cursor: pointer; text-decoration: none;
      transition: all 0.15s ease;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary { background: transparent; color: var(--fg); border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--fg); }
    .btn-ghost { background: transparent; color: var(--muted); }
    .btn-ghost:hover { color: var(--fg); }

    /* ── Cards ── */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 24px;
    }
    .card-flat { background: var(--surface); padding: 24px; border-bottom: 1px solid var(--border); }

    /* ── Features ── */
    .feature { display: flex; flex-direction: column; gap: 12px; }
    .feature-mark {
      width: 40px; height: 40px; border-radius: var(--radius);
      background: var(--accent-soft); display: flex; align-items: center; justify-content: center;
    }

    /* ── Stats ── */
    .stat { text-align: center; }
    .stat-num { font-family: var(--font-mono); font-size: var(--fs-h1); font-weight: 600; color: var(--fg); }
    .stat-label { font-size: var(--fs-sm); color: var(--muted); margin-top: 4px; }

    /* ── Quote ── */
    .quote { position: relative; padding-left: 24px; border-left: 3px solid var(--accent); }
    .quote-text { font-size: var(--fs-h3); font-style: italic; color: var(--fg); line-height: 1.5; }
    .quote-author { font-size: var(--fs-sm); color: var(--muted); margin-top: 12px; }

    /* ── Tags & Pills ── */
    .tag { display: inline-flex; padding: 4px 10px; border-radius: 4px; font-size: var(--fs-xs); background: var(--accent-soft); color: var(--accent); }
    .pill { display: inline-flex; padding: 6px 14px; border-radius: 999px; font-size: var(--fs-sm); border: 1px solid var(--border); }

    /* ── Inputs ── */
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: var(--fs-sm); font-weight: 500; }
    .input {
      padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius);
      font-size: var(--fs-body); font-family: var(--font-body); outline: none;
      transition: border-color 0.15s;
    }
    .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

    /* ── Placeholder Image ── */
    .ph-img {
      background: linear-gradient(135deg, var(--accent-soft) 0%, color-mix(in srgb, var(--border) 70%, var(--accent-soft)) 100%);
      border-radius: var(--radius-lg);
      display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: var(--fs-sm);
      position: relative; overflow: hidden;
    }
    .ph-img::after {
      content: ''; position: absolute; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='20' height='20' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='1' cy='1' r='1' fill='%23000' opacity='.06'/%3E%3C/svg%3E");
      background-size: 20px 20px;
    }
    .ph-img.square { aspect-ratio: 1; }
    .ph-img.wide { aspect-ratio: 16/9; }
    .ph-img.portrait { aspect-ratio: 3/4; }

    /* ── Dividers ── */
    .rule { border: none; border-top: 1px solid var(--border); margin: 32px 0; }

    /* ── Footer ── */
    .pagefoot {
      padding: 48px 0; border-top: 1px solid var(--border);
      font-size: var(--fs-sm); color: var(--muted);
    }

    /* ── Print ── */
    @media print {
      body { background: white; }
      .topnav { position: static; backdrop-filter: none; }
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
  </style>
</head>
<body>
  <!-- Top Navigation -->
  <nav class="topnav">
    <div class="container">
      <a class="brand" href="#">[REPLACE] 品牌名</a>
      <div class="nav-links">
        <a href="#">[REPLACE] 功能</a>
        <a href="#">[REPLACE] 定价</a>
        <a href="#">[REPLACE] 文档</a>
      </div>
      <div class="row">
        <a class="btn btn-ghost" href="#">登录</a>
        <a class="btn btn-primary" href="#">[REPLACE] 开始使用</a>
      </div>
    </div>
  </nav>

  <!-- Main Content (PASTE SECTIONS FROM layouts.md HERE) -->
  <main id="content">
  </main>

  <!-- Footer -->
  <footer class="pagefoot">
    <div class="container row-between">
      <span>[REPLACE] © 2024 品牌名</span>
      <div class="row">
        <a href="#" style="color:var(--muted);text-decoration:none;">隐私政策</a>
        <a href="#" style="color:var(--muted);text-decoration:none;">服务条款</a>
      </div>
    </div>
  </footer>
</body>
</html>
