<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grounding 监控面板</title>
<style>
:root{--bg:#0f0f14;--bg2:#1a1a24;--bg3:#252533;--accent:#7c5cfc;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--text:#e4e4e7;--text2:#a1a1aa;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:24px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
h1{font-size:22px;font-weight:600}
.tabs{display:flex;gap:8px}
.tabs button{background:var(--bg2);border:1px solid var(--bg3);color:var(--text2);padding:6px 16px;border-radius:6px;cursor:pointer;font-size:13px;transition:all .2s}
.tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px}
.card{background:var(--bg2);border:1px solid var(--bg3);border-radius:var(--radius);padding:16px}
.card .label{font-size:12px;color:var(--text2);margin-bottom:6px}
.card .value{font-size:26px;font-weight:700}
.card .value.green{color:var(--green)}.card .value.yellow{color:var(--yellow)}.card .value.red{color:var(--red)}
table{width:100%;border-collapse:collapse;background:var(--bg2);border-radius:var(--radius);overflow:hidden}
th,td{padding:10px 14px;text-align:left;font-size:13px;border-bottom:1px solid var(--bg3)}
th{background:var(--bg3);color:var(--text2);font-weight:500;font-size:12px;text-transform:uppercase}
tr:last-child td{border-bottom:none}
.bar-wrap{width:100%;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden}
.bar{height:100%;border-radius:3px;transition:width .4s}
.loading{text-align:center;padding:40px;color:var(--text2)}
.empty{text-align:center;padding:40px;color:var(--text2);font-size:14px}
</style>
</head>
<body>
<div class="header">
  <h1>Grounding 监控面板</h1>
  <div class="tabs">
    <button class="active" onclick="load(7)">7 天</button>
    <button onclick="load(14)">14 天</button>
    <button onclick="load(30)">30 天</button>
  </div>
</div>
<div id="cards" class="cards"></div>
<div id="table-wrap"></div>
<script>
function pct(v){return v!=null?(v*100).toFixed(1)+'%':'—'}
function scoreColor(v){return v>=0.5?'green':v>=0.2?'yellow':'red'}
function rateColor(v){return v<=0.05?'green':v<=0.15?'yellow':'red'}
function passColor(v){return v>=0.9?'green':v>=0.7?'yellow':'red'}

async function load(days){
  document.querySelectorAll('.tabs button').forEach((b,i)=>{
    b.classList.toggle('active',[7,14,30][i]===days)
  });
  document.getElementById('cards').innerHTML='<div class="loading">加载中...</div>';
  document.getElementById('table-wrap').innerHTML='';
  try{
    const r=await fetch('/api/admin/grounding?days='+days,{credentials:'include'});
    const d=await r.json();
    if(!d.total_checks){
      document.getElementById('cards').innerHTML='<div class="empty">暂无 grounding 数据</div>';
      return;
    }
    document.getElementById('cards').innerHTML=`
      <div class="card"><div class="label">总检查数</div><div class="value">${d.total_checks}</div></div>
      <div class="card"><div class="label">通过率</div><div class="value ${passColor(d.pass_rate)}">${pct(d.pass_rate)}</div></div>
      <div class="card"><div class="label">重试率</div><div class="value ${rateColor(d.retry_rate)}">${pct(d.retry_rate)}</div></div>
      <div class="card"><div class="label">硬拦截率</div><div class="value ${rateColor(d.hard_block_rate)}">${pct(d.hard_block_rate)}</div></div>
      <div class="card"><div class="label">平均分</div><div class="value ${scoreColor(d.avg_score)}">${d.avg_score!=null?d.avg_score.toFixed(3):'—'}</div></div>
      <div class="card"><div class="label">当前 Threshold</div><div class="value">${d.threshold!=null?d.threshold:'0.2'}</div></div>
    `;
    const bd=d.daily_breakdown||{};
    const keys=Object.keys(bd).sort().reverse();
    if(!keys.length)return;
    let rows=keys.map(k=>{
      const v=bd[k];
      const c=passColor(v.pass_rate);
      return `<tr>
        <td>${k}</td><td>${v.total}</td>
        <td><span style="color:var(--${c})">${pct(v.pass_rate)}</span></td>
        <td>
          <div style="display:flex;align-items:center;gap:8px">
            <div class="bar-wrap"><div class="bar" style="width:${(v.avg_score*100).toFixed(0)}%;background:var(--${scoreColor(v.avg_score)})"></div></div>
            <span>${v.avg_score.toFixed(3)}</span>
          </div>
        </td>
      </tr>`;
    }).join('');
    document.getElementById('table-wrap').innerHTML=`<table>
      <thead><tr><th>日期</th><th>检查数</th><th>通过率</th><th>平均分</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  }catch(e){
    document.getElementById('cards').innerHTML=`<div class="empty">加载失败: ${e.message}</div>`;
  }
}
load(7);
</script>
</body>
</html>
